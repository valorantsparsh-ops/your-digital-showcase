<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Your Name | Full-Stack Developer & Software Engineer Portfolio</title>
    <meta name="title" content="Your Name | Full-Stack Developer & Software Engineer Portfolio" />
    <meta name="description" content="Award-winning Full-Stack Developer specializing in React, TypeScript & scalable web applications. View my innovative projects, technical expertise, and professional journey. Available for hire." />
    <meta name="author" content="Your Name" />
    <meta name="keywords" content="full-stack developer, software engineer, React developer, TypeScript expert, web developer portfolio, frontend developer, backend developer, JavaScript developer, Python developer, hire developer" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://yourwebsite.com" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yourwebsite.com" />
    <meta property="og:title" content="Your Name | Full-Stack Developer & Software Engineer" />
    <meta property="og:description" content="Crafting exceptional digital experiences with modern web technologies. Explore my portfolio of innovative projects and technical expertise." />
    <meta property="og:image" content="https://yourwebsite.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Your Name - Full-Stack Developer Portfolio" />
    <meta property="og:site_name" content="Your Name Portfolio" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://yourwebsite.com" />
    <meta name="twitter:title" content="Your Name | Full-Stack Developer & Software Engineer" />
    <meta name="twitter:description" content="Crafting exceptional digital experiences with modern web technologies. Explore my portfolio of innovative projects." />
    <meta name="twitter:image" content="https://yourwebsite.com/og-image.png" />
    <meta name="twitter:site" content="@yourusername" />
    <meta name="twitter:creator" content="@yourusername" />

    <!-- Additional SEO -->
    <meta name="theme-color" content="#000000" />
    <meta name="msapplication-TileColor" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Your Name Portfolio" />
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Your Name",
      "url": "https://yourwebsite.com",
      "jobTitle": "Full-Stack Developer",
      "description": "Full-Stack Developer specializing in React, TypeScript, and scalable web applications",
      "sameAs": [
        "https://github.com/yourusername",
        "https://linkedin.com/in/yourusername",
        "https://twitter.com/yourusername"
      ],
      "knowsAbout": ["React", "TypeScript", "JavaScript", "Python", "Node.js", "Web Development", "Full-Stack Development"]
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
